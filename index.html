    const callGeminiAPI = async (userPrompt, systemPrompt = "") => {
      const apiKey = ""; // Provided by runtime environment if available
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        ...(systemPrompt ? { systemInstruction: { parts: [{ text: systemPrompt }] } } : {})
      };

      const delays = [1000, 2000, 4000, 8000, 16000];

      for (let i = 0; i < delays.length; i++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "暫時無法取得回覆，請稍後再試。";
        } catch (err) {
          if (i === delays.length - 1) {
            throw new Error("AI 顧問連線逾時，請檢查網路或稍後再試。");
          }
          await new Promise(res => setTimeout(res, delays[i]));
        }
      }
    };

                            <h3 className="text-2xl font-bold text-white">與曜昕聊聊 →</h3>
                            <p className="text-xs text-slate-400 mt-1">填寫企業需求，系統將發送通知至 eva@yaobiz.net</p>
                          </div>
                          <span className="text-[10px] text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-md border border-amber-500/20 font-mono">
                            Cloudflare SMTP Enabled
                          </span>
                        </div>

                        {submitError && (
                          <div className="p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-start space-x-2">
                            <Icons.AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                            <span>{submitError}</span>
                          </div>
                        )}

                        <div className="grid sm:grid-cols-2 gap-6">
                          <div>
                            <label className="block text-xs font-semibold text-slate-300 mb-2">企業名稱 *</label>
                            <input
                              type="text"
                              required
                              value={formData.companyName}
                              onChange={e => setFormData({ ...formData, companyName: e.target.value })}
                              placeholder="例如：曜昕企業管理顧問"
                              className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition text-sm"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-300 mb-2">聯絡人姓名與職稱 *</label>
                            <input
                              type="text"
                              required
                              value={formData.contactName}
                              onChange={e => setFormData({ ...formData, contactName: e.target.value })}
                              placeholder="例如：王總經理"
                              className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition text-sm"
                            />
                          </div>
                        </div>

                        <div className="grid sm:grid-cols-2 gap-6">
                          <div>
                            <label className="block text-xs font-semibold text-slate-300 mb-2">聯絡電話 *</label>
                            <input
                              type="tel"
                              required
                              value={formData.phone}
                              onChange={e => setFormData({ ...formData, phone: e.target.value })}
                              placeholder="0912-345-678"
                              className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition text-sm"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-300 mb-2">電子郵件 Email *</label>
                            <input
                              type="email"
                              required
                              value={formData.email}
                              onChange={e => setFormData({ ...formData, email: e.target.value })}
                              placeholder="eva@yaobiz.net"
                              className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition text-sm"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-2">主要想諮詢的服務項目 *</label>
                          <select
                            value={formData.serviceType}
                            onChange={e => setFormData({ ...formData, serviceType: e.target.value })}
                            className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-amber-400 transition text-sm"
                          >
                            <option value="市場開發">01｜市場開發 (政府標案、異業合作、生態圈)</option>
                            <option value="產品設計">02｜產品設計 (新產品、第二曲線、MVP測試)</option>
                            <option value="政府補助申請陪跑">03｜政府補助申請陪跑 (計畫書、商業模式梳理)</option>
                            <option value="綜合診斷諮詢">04｜綜合轉型與資源盤點諮詢</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-300 mb-2">說明您的現狀與想法需求</label>
                          <textarea
                            rows={4}
                            value={formData.message}
                            onChange={e => setFormData({ ...formData, message: e.target.value })}
                            placeholder="請簡述您目前的困境、想法或期待達成的目標..."
                            className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition text-sm"
                          />
                        </div>

                        <button
                          type="submit"
                          disabled={submitting}
                          className="w-full py-4 rounded-xl font-bold bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 hover:from-amber-400 hover:to-amber-500 shadow-lg shadow-amber-500/20 transition flex items-center justify-center space-x-2 text-base disabled:opacity-60"
                        >
                          {submitting ? (
                            <>
                              <Icons.Loader2 className="w-5 h-5 animate-spin" />
                              <span>經由 Cloudflare Worker 傳送中...</span>
                            </>
                          ) : (
                            <>
                              <Icons.Send className="w-5 h-5" />
                              <span>確認送出諮詢申請</span>
                            </>
                          )}
                        </button>
                      </form>
                    )}

                  </div>
                </div>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          {}
          <footer className="border-t border-slate-800 bg-slate-950 py-12 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4">
              <div className="flex justify-center mb-4">
                <LogoMark className="w-12 h-12 opacity-80" />
              </div>
              <p className="mb-1 font-semibold text-slate-400">曜昕企業管理顧問有限公司</p>
              <p className="text-[10px] text-slate-500 mb-3 tracking-wider">YAO HSIN BUSINESS MANAGEMENT CONSULTING CO., LTD.</p>
              <p className="mb-2">© {new Date().getFullYear()} All Rights Reserved.</p>
              <p>市場開發 ｜ 產品設計 ｜ 政府補助申請陪跑</p>
            </div>
          </footer>

          {/* FLOATING AI ASSISTANT BUTTON */}
          <div className="fixed bottom-6 right-6 z-40 flex flex-col space-y-3">
            <button
              onClick={() => setShowAIChat(true)}
              className="p-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-2xl hover:scale-105 transition flex items-center space-x-2 font-bold text-sm"
            >
              <Icons.Brain className="w-5 h-5" />
              <span className="hidden sm:inline">AI 智慧轉型顧問</span>
            </button>
          </div>

          {/* CLOUDFLARE WORKER CONFIG MODAL */}
          {}
          {showConfigModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 sm:p-8 relative shadow-2xl">
                <button
                  onClick={() => setShowConfigModal(false)}
                  className="absolute top-6 right-6 text-slate-400 hover:text-white"
                >
                  <Icons.X className="w-6 h-6" />
                </button>

                <div className="flex items-center space-x-2 text-amber-400 font-bold text-xs uppercase mb-2">
                  <Icons.Settings className="w-4 h-4" />
                  <span>Cloudflare Worker SMTP API 設定</span>
                </div>

                <h3 className="text-lg font-bold text-white mb-4">後端郵件 API 端點</h3>
                
                <p className="text-xs text-slate-400 leading-relaxed mb-4">
                  為了保護 SMTP 密碼與 API Key，瀏覽器端無法直接進行 SMTP 連線。請填寫您部署在 Cloudflare Worker 的 API URL：
                </p>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-2">Cloudflare Worker Endpoint URL</label>
                    <input
                      type="url"
                      value={cfWorkerUrl}
                      onChange={e => setCfWorkerUrl(e.target.value)}
                      placeholder="https://yaoxin-email.your-name.workers.dev/api/contact"
                      className="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white text-xs focus:outline-none focus:border-amber-400 font-mono"
                    />
                  </div>

                  {testApiMsg && (
                    <div className="p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-slate-200">
                      {testApiMsg}
                    </div>
                  )}

                  <div className="flex gap-3">
                    <button
                      type="button"
                      onClick={handleTestEndpoint}
                      disabled={testingApi}
                      className="flex-1 py-3 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 font-semibold text-xs flex items-center justify-center space-x-1"
                    >
                      {testingApi ? <Icons.Loader2 className="w-4 h-4" /> : <span>測試 API 連線</span>}
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowConfigModal(false)}
                      className="flex-1 py-3 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 transition text-xs"
                    >
                      儲存並返回
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* DIAGNOSTIC MODAL */}
          {}
          {showDiagnostic && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 sm:p-8 relative shadow-2xl">
                <button
                  onClick={() => { setShowDiagnostic(false); setDiagStep(1); }}
                  className="absolute top-6 right-6 text-slate-400 hover:text-white"
                >
                  <Icons.X className="w-6 h-6" />
                </button>

                <div className="flex items-center space-x-2 text-amber-400 font-bold text-xs uppercase mb-2">
                  <Icons.Zap className="w-4 h-4" />
                  <span>3分鐘企業切入點診斷</span>
                </div>

                {diagStep === 1 && (
                  <div className="space-y-6">
                    <h3 className="text-xl font-bold text-white">步驟 1/3：企業目前遇到的最大成長瓶頸是？</h3>
                    <div className="space-y-3">
                      {[
                        { id: 'new_product', label: '想做新產品，但不知道市場買不買單' },
                        { id: 'resource_mix', label: '有既有資源與技術，但不知道怎麼重新組合' },
                        { id: 'gov_market', label: '想切入政府市場/標案，不知道從哪開始' },
                        { id: 'gov_subsidy', label: '缺少轉型資金，想尋求政府補助計畫落地' }
                      ].map((opt) => (
                        <button
                          key={opt.id}
                          onClick={() => { setDiagData({ ...diagData, challenge: opt.id }); setDiagStep(2); }}
                          className="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left text-sm text-slate-200 transition"
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {diagStep === 2 && (
                  <div className="space-y-6">
                    <h3 className="text-xl font-bold text-white">步驟 2/3：您目前手邊最現成的資產是？</h3>
                    <div className="space-y-3">
                      {[
                        { id: 'mature_product', label: '穩定的主力產品與既有客群' },
                        { id: 'idle_capacity', label: '閒置產能、研發技術或專業服務能力' },
                        { id: 'brand_pr', label: '一定的品牌公關基礎與產業影響力' },
                        { id: 'idea_team', label: '初步創新的構想與執行團隊' }
                      ].map((opt) => (
                        <button
                          key={opt.id}
                          onClick={() => { setDiagData({ ...diagData, resource: opt.id }); setDiagStep(3); }}
                          className="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left text-sm text-slate-200 transition"
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {diagStep === 3 && (
                  <div className="space-y-6">
                    <h3 className="text-xl font-bold text-white">步驟 3/3：您最希望在短期內達成的目標？</h3>
                    <div className="space-y-3">
                      {[
                        { id: 'mvp', label: '用最小成本完成 MVP 產品市場驗證' },
                        { id: 'second_curve', label: '開拓第二營收曲線，獲取新客源' },
                        { id: 'gov_resource', label: '取得政府補助資源，降低研發風險' },
                        { id: 'ecosystem', label: '與異業建立生態圈導客合作' }
                      ].map((opt) => (
                        <button
                          key={opt.id}
                          onClick={() => {
                            setDiagData(prev => ({ ...prev, goal: opt.id }));
                            handleDiagnosticSubmit();
                          }}
                          className="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 hover:border-amber-400 text-left text-sm text-slate-200 transition"
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {diagStep === 4 && diagResult && (
                  <div className="space-y-6">
                    <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-center">
                      <span className="text-xs font-bold text-amber-400 block mb-1">診斷建議結果</span>
                      <h4 className="text-xl font-extrabold text-white">{diagResult.recService}</h4>
                    </div>

                    <div className="space-y-3">
                      <div className="p-4 rounded-xl bg-slate-800 border border-slate-700">
                        <span className="text-xs text-amber-400 font-bold block mb-1">【建議最小成本第一步】</span>
                        <p className="text-sm text-slate-200">{diagResult.firstStep}</p>
                      </div>
                      <div className="p-4 rounded-xl bg-slate-800 border border-slate-700">
                        <span className="text-xs text-slate-400 font-bold block mb-1">切入理由：</span>
                        <p className="text-xs text-slate-300 leading-relaxed">{diagResult.reason}</p>
                      </div>
                    </div>

                    <button
                      onClick={applyDiagToForm}
                      className="w-full py-3.5 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 transition text-sm flex items-center justify-center space-x-2"
                    >
                      <span>帶入診斷結果並預約線上討論</span>
                      <Icons.ArrowRight className="w-4 h-4" />
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CASE STUDY DETAIL MODAL */}
          {}
          {selectedCase && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setSelectedCase(null)}
                  className="absolute top-6 right-6 text-slate-400 hover:text-white"
                >
                  <Icons.X className="w-6 h-6" />
                </button>

                <span className="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 inline-block mb-4">
                  CASE {selectedCase.num} ｜ {selectedCase.category}
                </span>

                <h3 className="text-2xl font-bold text-white mb-6">{selectedCase.title}</h3>

                <div className="space-y-6 text-sm text-slate-300">
                  <div className="p-4 rounded-2xl bg-slate-800/80 border border-slate-700">
                    <h4 className="font-bold text-white mb-2 text-amber-400">專案背景與困境：</h4>
                    <p className="leading-relaxed">{selectedCase.details.background}</p>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-800/80 border border-slate-700">
                    <h4 className="font-bold text-white mb-2 text-amber-400">曜昕切入方案與策略：</h4>
                    <p className="leading-relaxed">{selectedCase.details.solution}</p>
                  </div>

                  <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30">
                    <h4 className="font-bold text-amber-400 mb-2">專案具體成果：</h4>
                    <p className="text-white font-semibold leading-relaxed">{selectedCase.details.result}</p>
                  </div>
                </div>

                <div className="mt-8 pt-4 border-t border-slate-800 flex justify-end">
                  <button
                    onClick={() => {
                      const cName = selectedCase.title;
                      setSelectedCase(null);
                      setFormData(prev => ({ ...prev, message: `我想了解類似案例：${cName}` }));
                      scrollToSection('contact');
                    }}
                    className="px-6 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 transition text-sm"
                  >
                    諮詢類似合作個案
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AI ASSISTANT DRAWER */}
          {}
          {showAIChat && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex justify-end">
              <div className="bg-slate-900 border-l border-slate-800 w-full max-w-md h-full flex flex-col shadow-2xl">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 font-bold flex items-center justify-center">
                      <Icons.Brain className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-bold text-sm text-white">曜昕 AI 轉型智慧顧問</h3>
                      <span className="text-[10px] text-amber-400 block">Powered by Gemini 2.5 Flash</span>
                    </div>
                  </div>
                  <button onClick={() => setShowAIChat(false)} className="text-slate-400 hover:text-white p-1">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-4 text-xs sm:text-sm">
                  {aiMessages.map((msg, i) => (
                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div
                        className={`max-w-[85%] p-3.5 rounded-2xl whitespace-pre-wrap leading-relaxed ${
                          msg.role === 'user'
                            ? 'bg-amber-500 text-slate-950 font-medium rounded-br-none'
                            : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
                        }`}
                      >
                        {msg.content}
                      </div>
                    </div>
                  ))}
                  {aiLoading && (
                    <div className="flex justify-start">
                      <div className="bg-slate-800 p-3.5 rounded-2xl border border-slate-700 text-slate-400 text-xs flex items-center space-x-2">
                        <Icons.RefreshCw className="w-4 h-4 animate-spin text-amber-400" />
                        <span>曜昕 AI 顧問正在為您分析瓶頸與最小第一步...</span>
                      </div>
                    </div>
                  )}
                </div>

                <form onSubmit={handleAiAsk} className="p-4 border-t border-slate-800 bg-slate-950">
                  <div className="flex items-center space-x-2">
                    <input
                      type="text"
                      value={aiInput}
                      onChange={e => setAiInput(e.target.value)}
                      placeholder="輸入您的企業狀況或產品問題..."
                      className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400"
                    />
                    <button
                      type="submit"
                      disabled={aiLoading || !aiInput.trim()}
                      className="p-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 disabled:opacity-50 transition"
                    >
                      <Icons.Send className="w-4 h-4" />
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
